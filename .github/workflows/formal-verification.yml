name: Formal redaction assurance

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'contracts/rate-limit-telemetry-v1*.json'
      - 'docs/rate-limit-telemetry.md'
      - 'scripts/check_formal_assurance.py'
      - 'scripts/check_rate_limit_telemetry.py'
      - 'langs/typescript/**'
      - 'langs/rust/**'
      - 'langs/dart/**'
      - '.github/workflows/formal-verification.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'contracts/rate-limit-telemetry-v1*.json'
      - 'docs/rate-limit-telemetry.md'
      - 'scripts/check_formal_assurance.py'
      - 'scripts/check_rate_limit_telemetry.py'
      - 'langs/typescript/**'
      - 'langs/rust/**'
      - 'langs/dart/**'
      - '.github/workflows/formal-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-redaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  properties:
    name: TypeScript, Rust, and Dart properties
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable
      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.70.0 --profile minimal --component rustfmt
      - name: Validate the closed assurance manifests
        run: |
          python3 scripts/check_formal_assurance.py
          python3 scripts/check_rate_limit_telemetry.py
      - name: Check TypeScript properties
        working-directory: langs/typescript
        run: npm test
      - name: Generate and check Rust formatting
        working-directory: langs/rust
        run: |
          set -euo pipefail
          rustfmt +1.70.0 --edition 2021 src/rate_limit.rs tests/formal_properties.rs tests/rate_limit_telemetry.rs
          git diff -- src/rate_limit.rs tests/formal_properties.rs tests/rate_limit_telemetry.rs > "${RUNNER_TEMP}/rustfmt.diff"
          test ! -s "${RUNNER_TEMP}/rustfmt.diff"
      - name: Upload Rust formatting patch on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rate-limit-rustfmt-${{ github.sha }}
          path: ${{ runner.temp }}/rustfmt.diff
          if-no-files-found: error
          retention-days: 3
      - name: Check Rust properties
        working-directory: langs/rust
        run: cargo +1.70.0 test
      - name: Install Dart dependencies
        working-directory: langs/dart
        run: dart pub get
      - name: Check Dart formal source formatting
        working-directory: langs/dart
        run: dart format --output=none --set-exit-if-changed tool/formal_check.dart
      - name: Check Dart properties
        working-directory: langs/dart
        run: dart run tool/formal_check.dart
