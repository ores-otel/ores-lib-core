name: OTel Atto bounded exporter model
on:
  pull_request:
    paths:
      - 'formal/atto-export/**'
      - '.github/workflows/atto-export-model.yml'
  workflow_dispatch:
jobs:
  source-safety-model:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node formal/atto-export/model.cjs
